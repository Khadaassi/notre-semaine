{% extends "planner/base.html" %}
{% block content %}
<div class="authbox">
  <h1>Rejoindre la famille</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      {% for err in field.errors %}<div class="err">{{ err }}</div>{% endfor %}
      {{ field }}
    {% endfor %}
    <button type="submit">Créer mon compte</button>
  </form>
  <p style="text-align:center;margin-top:14px;"><a href="{% url 'login' %}">J'ai déjà un compte</a></p>
</div>
{% endblock %}
