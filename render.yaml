services:
  - type: web
    name: notre-semaine
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FAMILY_INVITE_CODE
        sync: false  # set manually in the Render dashboard — never commit this value
      - key: DATABASE_URL
        fromDatabase:
          name: notre-semaine-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

databases:
  - name: notre-semaine-db
    plan: free
